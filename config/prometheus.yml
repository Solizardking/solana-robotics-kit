# Prometheus Configuration for Solana Robotics Network
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Node exporters
  - job_name: 'node-exporter-coordinator'
    static_configs:
      - targets: ['10.0.1.10:9100']
        labels:
          node: 'coordinator'
          role: 'coordinator'
  
  - job_name: 'node-exporter-worker'
    static_configs:
      - targets: ['10.0.1.11:9100']
        labels:
          node: 'worker'
          role: 'worker'
  
  - job_name: 'node-exporter-avatar'
    static_configs:
      - targets: ['10.0.1.12:9100']
        labels:
          node: 'avatar'
          role: 'avatar'
  
  - job_name: 'node-exporter-validator'
    static_configs:
      - targets: ['10.0.1.20:9100']
        labels:
          node: 'validator'
          role: 'validator'
  
  - job_name: 'node-exporter-robotics'
    static_configs:
      - targets: ['10.0.1.21:9100']
        labels:
          node: 'robotics'
          role: 'robotics'
  
  # Solana validator metrics
  - job_name: 'solana-validator'
    static_configs:
      - targets: ['10.0.1.20:9101']
        labels:
          service: 'solana'
  
  # Application metrics
  - job_name: 'coordinator-api'
    static_configs:
      - targets: ['10.0.1.10:9102']
  
  - job_name: 'worker-api'
    static_configs:
      - targets: ['10.0.1.11:9102']
  
  - job_name: 'avatar-api'
    static_configs:
      - targets: ['10.0.1.12:9102']
  
  - job_name: 'robotics-api'
    static_configs:
      - targets: ['10.0.1.21:9102']
