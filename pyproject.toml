[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-robotics-kit"
version = "1.0.0"
description = "Autonomous AI Robots Powered by NVIDIA GR00T & Solana Blockchain"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "8bit & @0rdlibrary", email = "contact@solana-robotics.io"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Robotics",
]
keywords = [
    "solana",
    "robotics",
    "nvidia",
    "groot",
    "ai",
    "blockchain",
    "trading",
    "autonomous",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "solana>=0.30.0",
    "solders>=0.18.0",
    "openai>=1.6.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
]
voice = [
    "livekit>=0.8.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
]
vision = [
    "opencv-python>=4.8.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
trading = [
    "ccxt>=4.1.0",
    "pandas>=2.1.0",
    "ta>=0.10.2",
]
vibe = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "base58>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/8bitsats/solana-robotics-kit"
Documentation = "https://github.com/8bitsats/solana-robotics-kit/tree/main/docs"
Repository = "https://github.com/8bitsats/solana-robotics-kit.git"
Issues = "https://github.com/8bitsats/solana-robotics-kit/issues"

[project.scripts]
solana-robot = "src.quickstart_groot:main"

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "examples"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function call in argument defaults
]

[tool.ruff.isort]
known-first-party = ["solana_robotics_kit", "src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
